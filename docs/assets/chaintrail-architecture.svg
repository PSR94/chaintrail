<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Chaintrail architecture</title><desc id="d">CLI commands flow through locking, canonicalization, append and verification into local journal files and external checkpoints.</desc><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".14"/></filter></defs><rect width="1200" height="650" rx="24" fill="#f8fafc"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="60" y="62" fill="#0f172a" font-size="34" font-weight="800">Chaintrail architecture</text><text x="60" y="94" fill="#64748b" font-size="17">Durable append path and independent integrity-verification path</text><g filter="url(#s)"><rect x="55" y="150" width="215" height="120" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="162" y="190" text-anchor="middle" fill="#1e3a8a" font-size="20" font-weight="800">CLI</text><text x="162" y="222" text-anchor="middle" fill="#334155" font-size="15">init · append · verify</text><text x="162" y="246" text-anchor="middle" fill="#334155" font-size="15">checkpoint · tail · repair</text><rect x="345" y="125" width="260" height="175" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="475" y="166" text-anchor="middle" fill="#115e59" font-size="20" font-weight="800">Journal engine</text><text x="475" y="198" text-anchor="middle" fill="#334155" font-size="15">validate input + canonical JSON</text><text x="475" y="224" text-anchor="middle" fill="#334155" font-size="15">sequence + previous hash</text><text x="475" y="250" text-anchor="middle" fill="#334155" font-size="15">SHA-256 record digest</text><text x="475" y="276" text-anchor="middle" fill="#334155" font-size="15">fsync + atomic head cache</text><rect x="345" y="370" width="260" height="150" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="475" y="410" text-anchor="middle" fill="#5b21b6" font-size="20" font-weight="800">Verification engine</text><text x="475" y="442" text-anchor="middle" fill="#334155" font-size="15">replay chain from metadata anchor</text><text x="475" y="468" text-anchor="middle" fill="#334155" font-size="15">validate seq · prev · hash</text><text x="475" y="494" text-anchor="middle" fill="#334155" font-size="15">validate canonical payload</text><rect x="685" y="105" width="220" height="105" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="795" y="147" text-anchor="middle" fill="#92400e" font-size="20" font-weight="800">OS file lock</text><text x="795" y="178" text-anchor="middle" fill="#334155" font-size="15">serialize writers / repair</text><rect x="685" y="250" width="220" height="230" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="795" y="290" text-anchor="middle" fill="#075985" font-size="20" font-weight="800">.chaintrail/</text><text x="795" y="329" text-anchor="middle" fill="#334155" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">meta.json</text><text x="795" y="359" text-anchor="middle" fill="#334155" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">journal.ndjson</text><text x="795" y="389" text-anchor="middle" fill="#334155" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">head.json</text><text x="795" y="419" text-anchor="middle" fill="#334155" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">journal.lock</text><text x="795" y="452" text-anchor="middle" fill="#64748b" font-size="13">head.json is a rebuildable cache</text><rect x="975" y="300" width="165" height="125" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1057" y="341" text-anchor="middle" fill="#166534" font-size="19" font-weight="800">Checkpoint</text><text x="1057" y="373" text-anchor="middle" fill="#334155" font-size="14">trusted external</text><text x="1057" y="397" text-anchor="middle" fill="#334155" font-size="14">rollback anchor</text></g><g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#m)"><path d="M270 210H340"/><path d="M605 180H680"/><path d="M795 210V245"/><path d="M605 250C650 250 650 365 680 365"/><path d="M680 420H610"/><path d="M905 365H970"/><path d="M975 405C915 540 640 565 530 520"/></g><text x="625" y="168" fill="#64748b" font-size="13">append</text><text x="624" y="410" fill="#64748b" font-size="13">replay</text><text x="925" y="351" fill="#64748b" font-size="13">pin</text></g></svg>