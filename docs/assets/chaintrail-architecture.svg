<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">Chaintrail system architecture</title><desc id="desc">Write, full verification and external trust-anchor paths for Chaintrail.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".13"/></filter></defs><rect width="1400" height="900" rx="28" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="60" y="62" fill="#0f172a" font-size="36" font-weight="800">Chaintrail system architecture</text><text x="60" y="96" fill="#64748b" font-size="18">Fast durable writes · complete replay for trusted reads · independent signed rollback anchors</text><g filter="url(#shadow)"><rect x="55" y="145" width="220" height="215" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="165" y="185" text-anchor="middle" fill="#1e3a8a" font-size="22" font-weight="800">CLI / Go API</text><text x="165" y="220" text-anchor="middle" fill="#334155" font-size="15">init · append · verify</text><text x="165" y="248" text-anchor="middle" fill="#334155" font-size="15">checkpoint · query · stats</text><text x="165" y="276" text-anchor="middle" fill="#334155" font-size="15">tail · repair · keygen</text><rect x="88" y="307" width="154" height="34" rx="17" fill="#bfdbfe"/><text x="165" y="330" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="700">strict exit semantics</text><rect x="350" y="135" width="285" height="245" rx="20" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="492" y="178" text-anchor="middle" fill="#115e59" font-size="22" font-weight="800">Write path</text><text x="492" y="216" text-anchor="middle" fill="#334155" font-size="15">validate kind + payload size</text><text x="492" y="244" text-anchor="middle" fill="#334155" font-size="15">canonicalize JSON payload</text><text x="492" y="272" text-anchor="middle" fill="#334155" font-size="15">resolve validated head fast path</text><text x="492" y="300" text-anchor="middle" fill="#334155" font-size="15">sequence + prev + SHA-256</text><text x="492" y="328" text-anchor="middle" fill="#334155" font-size="15">append · fsync · atomic cache</text><rect x="400" y="344" width="185" height="25" rx="12" fill="#99f6e4"/><text x="492" y="362" text-anchor="middle" fill="#0f766e" font-size="12" font-weight="700">exclusive OS lock</text><rect x="350" y="475" width="285" height="240" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="492" y="518" text-anchor="middle" fill="#5b21b6" font-size="22" font-weight="800">Full replay path</text><text x="492" y="556" text-anchor="middle" fill="#334155" font-size="15">metadata-derived anchor</text><text x="492" y="584" text-anchor="middle" fill="#334155" font-size="15">strict NDJSON decode</text><text x="492" y="612" text-anchor="middle" fill="#334155" font-size="15">seq · prev · time · canonical payload</text><text x="492" y="640" text-anchor="middle" fill="#334155" font-size="15">recompute every record hash</text><rect x="390" y="665" width="205" height="34" rx="17" fill="#ddd6fe"/><text x="492" y="688" text-anchor="middle" fill="#6d28d9" font-size="13" font-weight="700">shared OS lock</text><rect x="710" y="115" width="275" height="330" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="847" y="158" text-anchor="middle" fill="#075985" font-size="22" font-weight="800">Authoritative journal</text><text x="847" y="197" text-anchor="middle" fill="#0f172a" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" font-weight="700">meta.json</text><text x="847" y="226" text-anchor="middle" fill="#475569" font-size="13">journal ID · creation time · version</text><text x="847" y="271" text-anchor="middle" fill="#0f172a" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" font-weight="700">journal.ndjson</text><text x="847" y="300" text-anchor="middle" fill="#475569" font-size="13">append-only hash-chained records</text><line x1="750" y1="326" x2="945" y2="326" stroke="#bae6fd" stroke-width="2"/><text x="847" y="358" text-anchor="middle" fill="#475569" font-size="14">derivative / coordination</text><text x="847" y="387" text-anchor="middle" fill="#0f172a" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">head.json · journal.lock</text><text x="847" y="416" text-anchor="middle" fill="#64748b" font-size="12">cache is disposable, never proof</text><rect x="710" y="510" width="275" height="220" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="847" y="553" text-anchor="middle" fill="#92400e" font-size="22" font-weight="800">Trusted analysis</text><text x="847" y="592" text-anchor="middle" fill="#334155" font-size="15">verify → head identity</text><text x="847" y="620" text-anchor="middle" fill="#334155" font-size="15">query → validated filtered records</text><text x="847" y="648" text-anchor="middle" fill="#334155" font-size="15">stats → verified metrics</text><text x="847" y="676" text-anchor="middle" fill="#334155" font-size="15">tail → validated suffix</text><rect x="1055" y="125" width="290" height="195" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1200" y="168" text-anchor="middle" fill="#166534" font-size="22" font-weight="800">Checkpoint boundary</text><text x="1200" y="205" text-anchor="middle" fill="#334155" font-size="15">journal_id : sequence : hash</text><text x="1200" y="235" text-anchor="middle" fill="#334155" font-size="15">created only after full verification</text><rect x="1095" y="263" width="210" height="36" rx="18" fill="#bbf7d0"/><text x="1200" y="287" text-anchor="middle" fill="#15803d" font-size="13" font-weight="700">historical prefix remains valid</text><rect x="1055" y="385" width="290" height="295" rx="20" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="1200" y="428" text-anchor="middle" fill="#9d174d" font-size="22" font-weight="800">External trust domain</text><text x="1200" y="468" text-anchor="middle" fill="#334155" font-size="15">Ed25519 private key</text><text x="1200" y="496" text-anchor="middle" fill="#334155" font-size="15">↓ sign domain-separated payload</text><rect x="1090" y="520" width="220" height="54" rx="14" fill="#fbcfe8"/><text x="1200" y="544" text-anchor="middle" fill="#9d174d" font-size="14" font-weight="800">CT1 signed checkpoint</text><text x="1200" y="563" text-anchor="middle" fill="#be185d" font-size="11">archive outside journal host</text><text x="1200" y="608" text-anchor="middle" fill="#334155" font-size="15">public key → authenticate token</text><text x="1200" y="636" text-anchor="middle" fill="#334155" font-size="15">authenticated checkpoint → replay</text></g><g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"><path d="M275 230H345"/><path d="M275 300C315 300 315 590 345 590"/><path d="M635 250H705"/><path d="M710 390C665 390 665 565 640 565"/><path d="M635 595H705"/><path d="M985 620H1045"/><path d="M985 250H1045"/><path d="M1200 320V380"/><path d="M1055 635C1010 635 1010 670 990 670"/></g><g fill="#64748b" font-size="13"><text x="300" y="219">append</text><text x="286" y="478">verify/query/stats/tail</text><text x="655" y="238">durable write</text><text x="653" y="548">replay</text><text x="1005" y="607">results</text><text x="995" y="238">pin</text><text x="1000" y="657">trusted prefix</text></g><rect x="55" y="790" width="1290" height="65" rx="18" fill="#0f172a"/><text x="700" y="818" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Trust rule: journal + local cache prove internal consistency; rollback detection requires a checkpoint preserved outside the same compromise boundary.</text><text x="700" y="842" text-anchor="middle" fill="#94a3b8" font-size="13">Signed checkpoints authenticate the trust anchor, not individual event authors.</text></g></svg>
